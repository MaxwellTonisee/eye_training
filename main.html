<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Computer Vision project</title>
    <link rel="stylesheet" href="main.css">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/tensorflow-blazeface-sync@0.1.3/dist/blazeface.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection@0.4.1646425229/face_detection.min.js"></script>
</head>
<body>
    <h1>Deteksi Arah Pandang Mata</h1>
    <div class="panel">
        <video id="video" autoplay muted playsinline></video>
        <canvas id="overlay"></canvas>
        <div id="status-box">
            <p id="status-text">Menghubungkan kamera...</p>
            <p id="direction-text">Arah pandang: tengah</p>
            <p id="blink-text">Kedipan: 0</p>
            <p id="eye-state-text">Status mata: terbuka</p>
            <div id="analytics-box">
                <p id="model-status">Model: menunggu</p>
                <p id="accuracy-text">Akurasi estimasi: 0%</p>
                <p id="confidence-text">Confidence: 0%</p>
                <canvas id="analytics-chart" width="320" height="140"></canvas>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
